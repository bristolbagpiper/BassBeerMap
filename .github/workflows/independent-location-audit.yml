name: Independent location audit

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Compare every current location (otherwise rotate 45)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: directory-data
  queue: max
  cancel-in-progress: false

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare named official addresses without changing coordinates
        env:
          FULL_AUDIT: ${{ inputs.full }}
        run: |
          if [ "$FULL_AUDIT" = 'true' ]; then
            python -u full_location_audit.py
          else
            python -u full_location_audit.py --limit 45
          fi
      - name: Upload complete audit and review ordering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-location-audit
          path: candidate-independent/
          if-no-files-found: warn
