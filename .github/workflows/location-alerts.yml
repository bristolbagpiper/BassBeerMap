name: Location review notifications

on:
  workflow_run:
    workflows: ['Update CSV From PDF', 'Apply reviewed location']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/location-alerts.yml'
      - 'notify_location_review.py'
      - 'location_review.py'
      - 'directory-release.json'
      - 'trading-notices.json'

permissions:
  # Write permission is limited to this workflow's own SMTP acknowledgement.
  contents: write
  issues: write

concurrency:
  group: directory-data
  queue: max
  cancel-in-progress: false

jobs:
  notify:
    # Rejected imports already open their own durable issue. Do not turn them
    # into a location email retry loop or mix failure diagnostics into questions.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate the location register and embedded notices
        run: python validate_directory_release.py --allow-expired-evidence
      - name: Write the current owner review queue
        run: |
          python - <<'PY'
          from pathlib import Path
          from directory_release import read_json, write_json
          from location_review import format_report, with_trading_notice_reviews
          bundle = read_json('directory-release.json')
          report = with_trading_notice_reviews(read_json('location-review.json'),
                                               read_json('trading-notices.json'), bundle)
          write_json('notification-report.json', report)
          Path('location-review-report.md').write_text(format_report(report), encoding='utf-8')
          PY
      - name: Update the persistent GitHub review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('notification-report.json', 'utf8'));
            const body = fs.readFileSync('location-review-report.md', 'utf8').slice(0, 60000);
            const existing = (await github.rest.issues.get({...context.repo, issue_number:5})).data;
            if (report.actionable_count || report.trading_notice_reviews?.length) {
              if (existing.state !== 'open' || existing.body !== body) {
                await github.rest.issues.update({...context.repo, issue_number:existing.number, state:'open', body});
              }
            } else if (existing.state !== 'closed' || existing.body !== body) {
              await github.rest.issues.update({...context.repo, issue_number:existing.number, body, state:'closed', state_reason:'completed'});
            }
      - name: Email changed owner questions
        id: email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python notify_location_review.py --report notification-report.json
      - name: Commit notification acknowledgement
        run: |
          if [ ! -f location-alert-state.json ]; then exit 0; fi
          git add location-alert-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record current location notification state'
          if ! git push; then
            git pull --rebase origin main
            git push
          fi
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-review-report
          path: location-review-report.md
      - name: Make notification failures visible
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'BassBeerMap location notification failed';
            const body = `Changed owner questions could not be processed or accepted by SMTP. The acknowledgement was not advanced, so the next successful notification run will retry.\n\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
      - name: Close recovered notification failures
        if: success() && steps.email.outputs.result == 'accepted'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap location notification failed')) {
              await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed', state_reason:'completed'});
            }
