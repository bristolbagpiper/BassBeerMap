name: Location review notifications

on:
  workflow_run:
    workflows: ['Update CSV From PDF', 'Weekly map validation', 'Daily map validation', 'Independent location audit', 'Research unverified locations', 'Apply reviewed location']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_google_run_id:
        description: Optional exact local Google execution ID to verify before notification
        required: false
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/location-alerts.yml', 'notify_location_review.py', 'location_review.py', 'apply_closed_reviews.py', 'audit/closed-review-decisions.json', 'hermes-google-status.json', 'google-review-provider.json', 'directory-release.json']

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: directory-data
  queue: max
  cancel-in-progress: false

jobs:
  notify:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply matching owner review decisions
        run: |
          python apply_closed_reviews.py
          python validate_directory_release.py --allow-expired-evidence
          git add pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json audit/full-location-audit.json audit/full-location-audit.csv audit/full-location-audit.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh owner decisions and review reports'
            git push
          fi
      - name: Validate the location register
        run: python validate_directory_release.py --allow-expired-evidence
      - name: Write the complete review queue
        # Read main's current durable status, including failed health runs; a
        # delayed workflow_run event must not replace it with an old artifact.
        run: python -c "from directory_release import read_json, write_json; from location_review import format_report, load_google_status, load_health_status, with_google, with_health; from pathlib import Path; report = with_google(with_health(read_json('location-review.json'), load_health_status('map-health-status.json')), load_google_status('google-places-status.json'), read_json('directory-release.json')); write_json('notification-report.json', report); Path('location-review-report.md').write_text(format_report(report), encoding='utf-8')"
      - name: Verify requested Google execution and record receipt
        env:
          EXPECTED_GOOGLE_RUN_ID: ${{ inputs.expected_google_run_id }}
        run: |
          python - <<'PY'
          import json, os
          expected = os.environ.get('EXPECTED_GOOGLE_RUN_ID', '').strip()
          try:
              status = json.load(open('hermes-google-status.json', encoding='utf-8'))
          except FileNotFoundError:
              if expected:
                  raise SystemExit('Requested Google report is not present on current main')
              status = {}
          if expected and (status.get('provider') != 'hermes-browser' or str(status.get('run_id')) != expected):
              raise SystemExit('Google report run_id did not match the requested execution')
          if status.get('provider') == 'hermes-browser':
              report = json.load(open('notification-report.json', encoding='utf-8'))
              print(f"Hermes execution {report['google_run_id']}: {len(report['google_findings'])} review flags; "
                    f"{len(report['google_issues'])} source issues")
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Google report receipt\n\n')
                  summary.write(f"- execution ID: `{status.get('run_id', '')}`\n")
                  summary.write(f"- execution state: `{status.get('execution_state', '')}`\n")
                  summary.write(f"- source commit: `{status.get('source_commit') or 'unavailable'}`\n")
                  summary.write(f"- validated release: `{status.get('validated_release_id', '')}`\n")
                  summary.write(f"- completed at: `{status.get('source_execution_finished_at', '')}`\n")
          PY
      - name: Update the persistent GitHub review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('notification-report.json', 'utf8'));
            const title = 'BassBeerMap coordinate review';
            const source = context.payload.workflow_run;
            const isHealth = source && ['Weekly map validation', 'Daily map validation'].includes(source.name);
            const sameHealthRun = source && Number(report.health_run_id || 0) === Number(source.id);
            const healthCheckedAt = Date.parse(report.health_checked_at || '');
            const sourceCompletedAt = Date.parse(source?.updated_at || '');
            const comparableTimes = Number.isFinite(healthCheckedAt) && Number.isFinite(sourceCompletedAt);
            // A rerun can observe health after a higher run ID has completed.
            // Across distinct runs, observation time wins over allocation order.
            const newerHealth = source && (sameHealthRun
              ? Number(report.health_run_attempt || 1) > Number(source.run_attempt || 1)
              : comparableTimes && healthCheckedAt > sourceCompletedAt);
            const sameHealthAttempt = sameHealthRun && Number(report.health_run_attempt || 1) === Number(source.run_attempt || 1);
            // A failure after the status commit (for example artifact upload)
            // is still visible. A recovered newer run/attempt supersedes it.
            const representedHealth = isHealth && (newerHealth || (sameHealthAttempt && report.health_count));
            const sameGoogleAttempt = source && Number(report.google_run_id || 0) === Number(source.id)
              && Number(report.google_run_attempt || 1) === Number(source.run_attempt || 1);
            // Suppress only a proven Google-only failure. Persistence/upload
            // failures after the saved API result still need a pipeline alert.
            let representedGoogle = false;
            if (isHealth && sameHealthAttempt && sameGoogleAttempt && report.google_hard_failure && report.google_count) {
              try {
                const {data} = await github.rest.actions.listJobsForWorkflowRunAttempt({
                  ...context.repo, run_id: source.id, attempt_number: Number(source.run_attempt || 1), per_page: 100
                });
                const failedConclusions = new Set(['failure', 'timed_out', 'action_required']);
                const knownConclusions = new Set(['success', 'skipped', 'neutral', ...failedConclusions]);
                const jobs = data.jobs;
                const complete = Array.isArray(jobs) && jobs.length > 0 && data.total_count === jobs.length
                  && jobs.every(job => job.status === 'completed' && knownConclusions.has(job.conclusion));
                const failedJobs = complete ? jobs.filter(job => failedConclusions.has(job.conclusion)) : [];
                representedGoogle = failedJobs.length > 0 && failedJobs.every(job => {
                  if (!Array.isArray(job.steps) || !job.steps.length
                      || !job.steps.every(step => step.status === 'completed' && knownConclusions.has(step.conclusion))) return false;
                  const failedSteps = job.steps.filter(step => failedConclusions.has(step.conclusion));
                  return failedSteps.length > 0 && failedSteps.every(step => step.name === 'Rotate Google Places comparisons');
                });
              } catch {
                // Missing API permission or unavailable/incomplete evidence is inconclusive.
                representedGoogle = false;
              }
            }
            const failed = source && !representedHealth && !representedGoogle && ['failure', 'timed_out', 'action_required'].includes(source.conclusion);
            core.exportVariable('FAILURE_URL', failed ? source.html_url : '');
            const fullBody = (failed ? `Import or audit failed: ${source.html_url}\n\n` : '') + fs.readFileSync('location-review-report.md', 'utf8');
            const body = fullBody.length > 60000 ? fullBody.slice(0, 58000) + '\n\nReport shortened for GitHub. Full audit: https://github.com/bristolbagpiper/BassBeerMap/blob/main/audit/full-location-audit.md' : fullBody;
            const existing = (await github.rest.issues.get({...context.repo, issue_number:5})).data;
            if (report.active_count || report.google_count || report.health_count || failed) {
              if (existing.state !== 'open' || existing.body !== body) await github.rest.issues.update({...context.repo, issue_number:existing.number, state:'open', body});
            } else if (existing.state !== 'closed' || existing.body !== body) {
              await github.rest.issues.update({...context.repo, issue_number:existing.number, body, state:'closed', state_reason:'completed'});
            }
      - name: Email changed unverified locations and failed checks
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python notify_location_review.py --report notification-report.json --failure-url "$FAILURE_URL"
      - name: Commit successful email acknowledgement
        run: |
          if [ ! -f location-alert-state.json ]; then exit 0; fi
          git add location-alert-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record successful location alert delivery'
          if ! git push; then
            # A new handoff or directory commit can land during SMTP delivery.
            # Replay only this acknowledgement onto current main, without resending.
            git pull --rebase origin main
            git push
          fi
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-review-report
          path: location-review-report.md
      - name: Make notification failures visible
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'BassBeerMap location notification failed';
            const body = `Location alert delivery did not complete. Check the failed step and SMTP configuration. Delivery will be retried on the next import, weekly audit or manual notification run.\n\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
      - name: Close recovered notification failures
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap location notification failed')) {
              await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed', state_reason:'completed'});
            }

