name: Research unverified locations

on:
  workflow_dispatch:
    inputs:
      venue_id:
        description: 'Current venue ID (optional, otherwise check up to 30)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build a review candidate for up to 30 unresolved venue locations
        env:
          VENUE_ID: ${{ inputs.venue_id }}
        run: python research_locations.py --limit 30 --venue-id "$VENUE_ID"
      - name: Validate the proposed candidate without publishing it
        run: python validate_directory_release.py --root candidate-research --previous .
      - name: Retain research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-research
          path: candidate-research/
