name: Update CSV From PDF

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-csv-from-pdf.yml"
      - "convert_pdf_to_csv.py"
      - "fetch_latest_pdf.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: aaron.george.smart@gmail.com
      ALERT_FROM: ${{ secrets.ALERT_FROM }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest PDF from WordPress
        run: python fetch_latest_pdf.py latest-bass-directory.pdf

      - name: Remove older PDF files
        shell: bash
        run: |
          shopt -s nullglob
          for pdf in *.pdf; do
            if [ "$pdf" != "latest-bass-directory.pdf" ]; then
              rm -f "$pdf"
            fi
          done

      - name: Generate candidate CSV
        run: python convert_pdf_to_csv.py latest-bass-directory.pdf candidate-pubs.csv

      - name: Validate candidate CSV
        id: validate
        continue-on-error: true
        run: python validate_csv.py candidate-pubs.csv --previous pubs.csv --report validation-report.json

      - name: Email validation failure
        if: steps.validate.outcome == 'failure' && env.SMTP_HOST != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.ALERT_TO != ''
        run: python send_alert_email.py --subject "BassBeerMap update rejected" --report validation-report.json

      - name: Fail workflow after rejected validation
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Candidate CSV failed validation. See validation-report.json for details."
          exit 1

      - name: Publish validated CSV
        shell: bash
        run: mv candidate-pubs.csv pubs.csv

      - name: Commit refreshed PDF and CSV
        shell: bash
        run: |
          if git diff --quiet -- '*.pdf' pubs.csv; then
            echo "No PDF or CSV changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.pdf' pubs.csv
          git commit -m "Refresh latest PDF and pubs.csv"
          git push
