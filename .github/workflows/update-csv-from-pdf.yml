name: Update CSV From PDF

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  push:
    paths:
      - "*.pdf"
      - ".github/workflows/update-csv-from-pdf.yml"
      - "convert_pdf_to_csv.py"
      - "fetch_latest_pdf.py"
      - "send_alert_email.py"
      - "validate_csv.py"
      - "build_coordinates.py"
      - "build_change_report.py"
      - "build_coordinate_review_queue.py"
      - "resolve_venue_coordinates.py"
      - "resolve_venue_coordinates_from_osm.py"
      - "resolve_venue_coordinates_from_fhrs.py"
      - "send_change_report_email.py"
      - "postcode-overrides.json"
      - "venue-coordinates.json"
      - "venue-coordinate-overrides.json"
      - "directory_release.py"
      - "location_review.py"
      - "ingest_directory.py"
      - "coordinate_sources.py"
      - "validate_directory_release.py"
      - "ingestion-decisions.json"
      - "requirements.txt"
      - "tests/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: directory-data
  # Imports and health checks publish the same release assets. Queue them
  # so their commits cannot overwrite one another.
  cancel-in-progress: false

jobs:
  update-csv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Run browser smoke test
        env:
          RUN_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -p "test_frontend_smoke.py" -v

      - name: Resolve latest PDF source
        id: pdf_source
        shell: bash
        run: |
          shopt -s nullglob
          latest_pdf=""
          echo "GitHub event: ${{ github.event_name }}"
          echo "PDF files currently in repo root:"
          ls -1 *.pdf 2>/dev/null || echo "None"

          if [ "${{ github.event_name }}" = "push" ]; then
            uploaded_pdfs=( )
            for pdf in *.pdf; do
              if [ "$pdf" != "latest-bass-directory.pdf" ]; then
                uploaded_pdfs+=( "$pdf" )
              fi
            done

            echo "Candidate uploaded PDFs:"
            printf '%s\n' "${uploaded_pdfs[@]}"

            if [ "${#uploaded_pdfs[@]}" -gt 0 ]; then
              latest_pdf="${uploaded_pdfs[-1]}"
            fi
          fi

          if [ -n "$latest_pdf" ]; then
            echo "mode=uploaded" >> "$GITHUB_OUTPUT"
            echo "uploaded_pdf=$latest_pdf" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=wordpress" >> "$GITHUB_OUTPUT"

      - name: Download latest PDF from WordPress
        if: steps.pdf_source.outputs.mode == 'wordpress'
        run: python fetch_latest_pdf.py latest-bass-directory.pdf

      - name: Normalise uploaded PDF
        if: steps.pdf_source.outputs.mode == 'uploaded'
        shell: bash
        run: |
          uploaded_pdf="${{ steps.pdf_source.outputs.uploaded_pdf }}"
          if [ "$uploaded_pdf" != "latest-bass-directory.pdf" ]; then
            rm -f latest-bass-directory.pdf
            mv "$uploaded_pdf" latest-bass-directory.pdf
          fi

      - name: Remove older PDF files
        shell: bash
        run: |
          shopt -s nullglob
          for pdf in *.pdf; do
            if [ "$pdf" != "latest-bass-directory.pdf" ]; then
              rm -f "$pdf"
            fi
          done

      - name: Generate candidate CSV
        shell: bash
        run: |
          if [ "${{ steps.pdf_source.outputs.mode }}" = "uploaded" ] && [ -n "${{ steps.pdf_source.outputs.uploaded_pdf }}" ]; then
            python convert_pdf_to_csv.py latest-bass-directory.pdf candidate-pubs.csv --metadata candidate-directory-meta.json --source-name "${{ steps.pdf_source.outputs.uploaded_pdf }}"
          else
            python convert_pdf_to_csv.py latest-bass-directory.pdf candidate-pubs.csv --metadata candidate-directory-meta.json
          fi

      - name: Reconcile, enrich and validate the complete candidate release
        id: candidate
        run: python ingest_directory.py candidate-pubs.csv --staging candidate-release

      - name: Validate candidate files again before publication
        run: python validate_directory_release.py --root candidate-release --previous .

      - name: Run browser smoke test against the candidate release
        env:
          RUN_BROWSER_TESTS: "1"
          DIRECTORY_TEST_ROOT: candidate-release
        run: python -m unittest discover -s tests -p "test_frontend_smoke.py" -v

      - name: Upload candidate validation and review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-import-review
          path: candidate-release/
          if-no-files-found: warn

      - name: Publish the complete validated release
        run: |
          python validate_directory_release.py --root candidate-release --previous .
          python -c "from pathlib import Path; from shutil import copyfile; from directory_release import RELEASE_FILES; [copyfile(Path('candidate-release') / name, name) for name in RELEASE_FILES]"
          python validate_directory_release.py
          if git diff --quiet -- '*.pdf' pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json; then
            echo "No directory changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.pdf' pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json
          git commit -m "Publish validated directory release"
          git push

      - name: Email the validated change report when configured
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CHANGE_REPORT_TO: ${{ secrets.CHANGE_REPORT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: |
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$CHANGE_REPORT_TO" ]; then
            python -c "import json,sys; r=json.load(open('candidate-release/change-report.json')); sys.exit(0 if r['summary']['has_changes'] or '${{ github.event_name }}' == 'workflow_dispatch' else 1)" && python send_change_report_email.py --report candidate-release/change-report.json || exit 0
          fi

      - name: Close resolved import alerts
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state:'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap update rejected')) {
              await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed', state_reason:'completed'});
            }

      - name: Report rejected import
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'candidate-release/validation-report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
            const errors = report.errors?.length ? report.errors : ['The workflow failed; inspect the failed step and candidate artifacts.'];
            const title = 'BassBeerMap update rejected';
            const body = ['The previous published release is retained.', '', ...errors.map(e => `- ${e}`), '', `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
