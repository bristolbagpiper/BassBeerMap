name: Update CSV From PDF

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      allow_reindex:
        description: Allow reviewed listing changes from an unchanged PDF
        type: boolean
        default: false
  push:
    branches:
      - main
    paths: ["*.pdf"]

permissions:
  actions: write
  contents: write
  pages: write
  issues: write

concurrency:
  group: directory-data
  queue: max
  # Owner-approved corrections and imports can update the same directory.
  cancel-in-progress: false

jobs:
  update-csv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      publication_commit: ${{ steps.publication.outputs.commit }}
      previous_commit: ${{ steps.source_fingerprint.outputs.baseline_commit }}
      published_on: ${{ steps.readback_stamp.outputs.published_on }}
      new_pdf: ${{ steps.source_fingerprint.outputs.unchanged == 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Queued jobs validate/publish against the latest main data, while
          # the selector extracts uploads from the exact push event commit.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve latest PDF source
        id: pdf_source
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python pdf_source_selector.py

      - name: Check canonical PDF push freshness
        id: canonical_event
        if: steps.pdf_source.outputs.mode == 'canonical_release'
        env:
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          current=false
          if git merge-base --is-ancestor "$EVENT_AFTER" HEAD; then
            event_pdf_commit=$(git log -1 --format=%H "$EVENT_AFTER" -- latest-bass-directory.pdf)
            current_pdf_commit=$(git log -1 --format=%H HEAD -- latest-bass-directory.pdf)
            if [ -n "$event_pdf_commit" ] && [ "$event_pdf_commit" = "$current_pdf_commit" ]; then current=true; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Canonical PDF event has not been superseded by a newer PDF: $current"
          if [ "$current" != "true" ]; then
            echo "The event is not an ancestor of main or a newer canonical PDF superseded it; this queued import will skip." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download latest PDF from WordPress
        id: wordpress_download
        if: steps.pdf_source.outputs.mode == 'wordpress'
        run: python fetch_latest_pdf.py latest-bass-directory.pdf

      - name: Compare upstream PDF with the published source
        id: source_fingerprint
        if: steps.pdf_source.outputs.mode != 'skip' && (steps.pdf_source.outputs.mode != 'canonical_release' || steps.canonical_event.outputs.current == 'true')
        env:
          SELECTED_PDF: ${{ steps.pdf_source.outputs.source_pdf }}
          BASELINE_REF: ${{ steps.pdf_source.outputs.mode == 'canonical_release' && github.event.before || 'HEAD' }}
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          previous = subprocess.run(['git', 'show', os.environ['BASELINE_REF'] + ':latest-bass-directory.pdf'], check=True,
                                    stdout=subprocess.PIPE).stdout
          downloaded = Path(os.environ['SELECTED_PDF']).read_bytes()
          previous_hash = hashlib.sha256(previous).hexdigest()
          downloaded_hash = hashlib.sha256(downloaded).hexdigest()
          baseline_commit = subprocess.run(['git', 'rev-parse', os.environ['BASELINE_REF']], check=True,
                                           stdout=subprocess.PIPE, text=True).stdout.strip()
          unchanged = previous_hash == downloaded_hash
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"unchanged={str(unchanged).lower()}\n")
              output.write(f"baseline_commit={baseline_commit}\n")
              output.write('eligible=true\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Directory source check\n\n')
              summary.write(f'- Published PDF SHA-256: `{previous_hash}`\n')
              summary.write(f'- Downloaded PDF SHA-256: `{downloaded_hash}`\n')
              summary.write(f'- Source unchanged: `{str(unchanged).lower()}`\n')
              if unchanged:
                  summary.write('- Import and enrichment remain skipped; pending priority Google work is checked from the current registry and CSV.\n')
          print(f"Source PDF SHA-256: {downloaded_hash}; unchanged={str(unchanged).lower()}")
          PY

      - name: Inspect pending Google work for unchanged source
        id: google_pending
        if: steps.source_fingerprint.outputs.eligible == 'true' && steps.source_fingerprint.outputs.unchanged == 'true' && !inputs.allow_reindex
        run: |
          python - <<'PY'
          import csv, json, os
          rows = list(csv.DictReader(open('pubs.csv', encoding='utf-8-sig', newline='')))
          registry = json.load(open('venue-registry.json', encoding='utf-8'))['venues']
          pending = any(registry.get(row.get('venue_id'), {}).get('google_priority_pending') is True for row in rows)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'pending={str(pending).lower()}\n')
          print(f'Pending priority Google checks: {pending}')
          PY

      - name: Install dependencies
        if: steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex || steps.google_pending.outputs.pending == 'true')
        run: pip install -r requirements.txt

      - name: Resume priority Google checks
        id: google_resume
        if: steps.source_fingerprint.outputs.eligible == 'true' && steps.source_fingerprint.outputs.unchanged == 'true' && !inputs.allow_reindex && steps.google_pending.outputs.pending == 'true'
        run: python resume_google.py

      - name: Generate candidate CSV
        if: steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex)
        env:
          PDF_SOURCE_PATH: ${{ steps.pdf_source.outputs.source_pdf }}
          PDF_SOURCE_NAME_FILE: ${{ steps.pdf_source.outputs.source_name_file }}
          PDF_SOURCE_MODE: ${{ steps.pdf_source.outputs.mode }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          source = os.environ['PDF_SOURCE_PATH']
          args = [sys.executable, 'convert_pdf_to_csv.py', source, 'candidate-pubs.csv',
                  '--metadata', 'candidate-directory-meta.json']
          name_file = os.environ.get('PDF_SOURCE_NAME_FILE', '')
          if name_file:
              with open(name_file, encoding='utf-8') as handle:
                  args += ['--source-name', json.load(handle)]
          subprocess.run(args, check=True)
          PY

      - name: Reconcile, enrich and validate the complete candidate release
        id: candidate
        if: steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex)
        env:
          PDF_SOURCE_PATH: ${{ steps.pdf_source.outputs.source_pdf }}
        run: python ingest_directory.py candidate-pubs.csv --staging candidate-release --source-pdf "$PDF_SOURCE_PATH" --google

      - name: Validate candidate files again before publication
        id: candidate_validation
        if: steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex)
        run: python validate_directory_release.py --root candidate-release --previous . --check-pdf

      - name: Guard against unexpected changes from an unchanged PDF
        if: steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex)
        env:
          ALLOW_REINDEX: ${{ inputs.allow_reindex }}
          PDF_SOURCE_PATH: ${{ steps.pdf_source.outputs.source_pdf }}
          PDF_BASELINE_REF: ${{ github.event.before || 'HEAD' }}
        run: |
          args=(--source-pdf "$PDF_SOURCE_PATH" --baseline-ref "$PDF_BASELINE_REF")
          if [ "$ALLOW_REINDEX" = "true" ]; then
            args+=(--allow-reindex)
          fi
          python guard_unchanged_pdf.py "${args[@]}"

      - name: Run browser smoke test against the candidate release
        if: steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex)
        env:
          RUN_BROWSER_TESTS: "1"
          DIRECTORY_TEST_ROOT: candidate-release
        run: python -m unittest discover -s tests -p "test_frontend_smoke.py" -v

      - name: Upload candidate validation and review artifacts
        if: always() && steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex)
        uses: actions/upload-artifact@v4
        with:
          name: directory-import-review
          path: candidate-release/
          if-no-files-found: warn

      - name: Publish the complete validated release
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_RESUME: ${{ steps.google_resume.outputs.progress }}
          PDF_SOURCE_MODE: ${{ steps.pdf_source.outputs.mode }}
          NEW_PDF: ${{ steps.source_fingerprint.outputs.unchanged == 'false' }}
        if: steps.source_fingerprint.outputs.eligible == 'true' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex || steps.google_resume.outputs.progress == 'true')
        run: |
          if [ "$GOOGLE_RESUME" != "true" ]; then
            python validate_directory_release.py --root candidate-release --previous .
            python -c "from pathlib import Path; from shutil import copyfile; from directory_release import RELEASE_FILES; [copyfile(Path('candidate-release') / name, name) for name in RELEASE_FILES]"
          fi
          python validate_directory_release.py
          if [ "$GOOGLE_RESUME" = "true" ]; then
            changed_files=(venue-registry.json directory-release.json location-review.json)
          else
            changed_files=(latest-bass-directory.pdf pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json)
          fi
          if ! git diff --quiet -- location-review.json; then
            echo "review_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- "${changed_files[@]}"; then
            echo "No directory changes detected."
            if [ "$GOOGLE_RESUME" != "true" ] && [ "$PDF_SOURCE_MODE" = "canonical_release" ] && [ "$NEW_PDF" = "true" ]; then
              echo "The validated canonical PDF is already present in the current main commit; verify its live Pages release."
              echo "state=published" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "state=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed_files[@]}"
          if [ "$GOOGLE_RESUME" = "true" ]; then
            git commit -m "Resume priority Google checks"
            echo "google_resume=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish validated directory release"
          fi
          python promote_checked_commit.py
          echo "state=published" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify GitHub Pages release
        id: pages_release
        if: steps.publication.outputs.state == 'published' && (steps.publication.outputs.google_resume != 'true' || steps.google_resume.outputs.visitor_changed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_PAGES_COMMIT: ${{ steps.publication.outputs.commit }}
        run: python request_pages_release.py

      - name: Record verified visitor readback time
        id: readback_stamp
        if: steps.pages_release.outcome == 'success'
        run: echo "published_on=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Report Pages deployment failure
        if: failure() && steps.pages_release.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'BassBeerMap Pages deployment failed';
            const body = [`The validated directory release was committed, but the GitHub Pages deployment/readback did not complete for commit ${{ steps.publication.outputs.commit }}.`, '', `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

      - name: Close recovered Pages deployment failures
        if: steps.pages_release.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap Pages deployment failed')) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
            }

      - name: Inspect trading notices for owner review
        id: notice_review
        if: steps.source_fingerprint.outputs.unchanged == 'true'
        run: |
          python - <<'PY'
          import os
          from directory_release import read_json
          from location_review import with_trading_notice_reviews

          report = with_trading_notice_reviews({}, read_json('trading-notices.json'),
                                               read_json('directory-release.json'))
          due = report['trading_notice_reviews']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'due={str(bool(due)).lower()}\n')
          print(f'Trading notices due for owner review: {len(due)}')
          PY

      - name: Dispatch owner review after same-source check
        if: >-
          steps.source_fingerprint.outputs.unchanged == 'true' &&
          (steps.notice_review.outputs.due == 'true' ||
           (steps.publication.outputs.state == 'published' && steps.publication.outputs.review_changed == 'true'))
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'location-alerts.yml', ref: 'main'
            });

      - name: Close resolved import alerts
        if: always() && steps.candidate_validation.outcome == 'success' && steps.publication.outcome == 'success' && steps.pages_release.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state:'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap update rejected')) {
              await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed', state_reason:'completed'});
            }

      - name: Report rejected import
        if: failure() && steps.canonical_event.outputs.current != 'false' && (steps.source_fingerprint.outputs.unchanged != 'true' || inputs.allow_reindex || steps.google_resume.outcome == 'failure') && steps.publication.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'candidate-release/validation-report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
            const errors = report.errors?.length ? report.errors : ['The workflow failed; inspect the failed step and candidate artifacts.'];
            const title = 'BassBeerMap update rejected';
            const body = ['The previous published release is retained.', '', ...errors.map(e => `- ${e}`), '', `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

      - name: Summarize import and publication states
        if: always()
        env:
          CANDIDATE_INGEST_OUTCOME: ${{ steps.candidate.outcome }}
          CANDIDATE_VALIDATION_OUTCOME: ${{ steps.candidate_validation.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          PUBLICATION_STATE: ${{ steps.publication.outputs.state }}
          PAGES_OUTCOME: ${{ steps.pages_release.outcome }}
        run: |
          {
            echo "## Import outcome"
            echo "- Candidate ingestion: ${CANDIDATE_INGEST_OUTCOME:-not reached}"
            echo "- Candidate validation: ${CANDIDATE_VALIDATION_OUTCOME:-not reached}"
            echo "- Repository publication: ${PUBLICATION_STATE:-${PUBLICATION_OUTCOME:-not reached}}"
            echo "- GitHub Pages deployment/readback: ${PAGES_OUTCOME:-not reached}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-published-pdf:
    needs: update-csv
    if: always() && needs.update-csv.outputs.new_pdf == 'true' && needs.update-csv.outputs.publication_commit != '' && needs.update-csv.outputs.previous_commit != '' && needs.update-csv.outputs.published_on != ''
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch consolidated publication notification
        uses: actions/github-script@v7
        env:
          PUBLICATION_COMMIT: ${{ needs.update-csv.outputs.publication_commit }}
          PREVIOUS_COMMIT: ${{ needs.update-csv.outputs.previous_commit }}
          PUBLISHED_ON: ${{ needs.update-csv.outputs.published_on }}
        with:
          script: |
            const publication_commit = process.env.PUBLICATION_COMMIT;
            const previous_commit = process.env.PREVIOUS_COMMIT;
            const published_on = process.env.PUBLISHED_ON;
            if (!/^[0-9a-f]{40}$/.test(publication_commit) || !/^[0-9a-f]{40}$/.test(previous_commit) || !/^\d{4}-\d{2}-\d{2}$/.test(published_on)) {
              core.setFailed('Publication notification metadata failed validation.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'location-alerts.yml',
              ref: 'main',
              inputs: { publication_commit, previous_commit, published_on }
            });
      - name: Report dispatch failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'BassBeerMap publication notification dispatch failed';
            const body = [`The PDF was published and verified, but the consolidated location notification was not dispatched for commit ${{ needs.update-csv.outputs.publication_commit }}. Re-run the notify-published-pdf job to retry with the same publication details.`, '', `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
      - name: Close recovered dispatch failures
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap publication notification dispatch failed')) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
            }

