name: Update CSV From PDF

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "*.pdf"
      - ".github/workflows/update-csv-from-pdf.yml"
      - "convert_pdf_to_csv.py"
      - "fetch_latest_pdf.py"
      - "send_alert_email.py"
      - "validate_csv.py"
      - "requirements.txt"

permissions:
  contents: write
  issues: write

jobs:
  update-csv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: aaron.george.smart@gmail.com
      ALERT_FROM: ${{ secrets.ALERT_FROM }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve latest PDF source
        id: pdf_source
        shell: bash
        run: |
          shopt -s nullglob
          latest_pdf=""

          if [ "${{ github.event_name }}" = "push" ]; then
            mapfile -t changed_pdfs < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*.pdf')
            if [ "${#changed_pdfs[@]}" -gt 0 ]; then
              latest_pdf="${changed_pdfs[-1]}"
            fi
          fi

          if [ -n "$latest_pdf" ]; then
            echo "mode=uploaded" >> "$GITHUB_OUTPUT"
            echo "uploaded_pdf=$latest_pdf" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=wordpress" >> "$GITHUB_OUTPUT"

      - name: Download latest PDF from WordPress
        if: steps.pdf_source.outputs.mode == 'wordpress'
        run: python fetch_latest_pdf.py latest-bass-directory.pdf

      - name: Normalise uploaded PDF
        if: steps.pdf_source.outputs.mode == 'uploaded'
        shell: bash
        run: |
          uploaded_pdf="${{ steps.pdf_source.outputs.uploaded_pdf }}"
          if [ "$uploaded_pdf" != "latest-bass-directory.pdf" ]; then
            rm -f latest-bass-directory.pdf
            mv "$uploaded_pdf" latest-bass-directory.pdf
          fi

      - name: Remove older PDF files
        shell: bash
        run: |
          shopt -s nullglob
          for pdf in *.pdf; do
            if [ "$pdf" != "latest-bass-directory.pdf" ]; then
              rm -f "$pdf"
            fi
          done

      - name: Generate candidate CSV
        run: python convert_pdf_to_csv.py latest-bass-directory.pdf candidate-pubs.csv

      - name: Validate candidate CSV
        id: validate
        continue-on-error: true
        run: python validate_csv.py candidate-pubs.csv --previous pubs.csv --report validation-report.json

      - name: Check email config
        if: always() && steps.validate.outcome == 'failure'
        shell: bash
        run: |
          [ -n "${SMTP_HOST}" ] || echo "Missing SMTP_HOST"
          [ -n "${SMTP_USERNAME}" ] || echo "Missing SMTP_USERNAME"
          [ -n "${SMTP_PASSWORD}" ] || echo "Missing SMTP_PASSWORD"
          [ -n "${ALERT_TO}" ] || echo "Missing ALERT_TO"

      - name: Email validation failure
        if: always() && steps.validate.outcome == 'failure' && env.SMTP_HOST != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.ALERT_TO != ''
        run: python send_alert_email.py --subject "BassBeerMap update rejected" --report validation-report.json

      - name: Create GitHub issue fallback alert
        if: always() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('validation-report.json', 'utf8'));
            const errors = (report.errors || []).map(error => `- ${error}`).join('\n');
            const title = 'BassBeerMap update rejected';
            const body = [
              'The automated PDF-to-CSV update was rejected.',
              '',
              'Validation errors:',
              errors || '- No validation errors were recorded.',
              '',
              `Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail workflow after rejected validation
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Candidate CSV failed validation. See validation-report.json for details."
          exit 1

      - name: Publish validated CSV
        shell: bash
        run: mv candidate-pubs.csv pubs.csv

      - name: Commit refreshed PDF and CSV
        shell: bash
        run: |
          if git diff --quiet -- '*.pdf' pubs.csv; then
            echo "No PDF or CSV changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.pdf' pubs.csv
          git commit -m "Refresh latest PDF and pubs.csv"
          git push
