name: Update CSV From PDF

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  push:
    paths:
      - "*.pdf"
      - ".github/workflows/update-csv-from-pdf.yml"
      - "convert_pdf_to_csv.py"
      - "fetch_latest_pdf.py"
      - "send_alert_email.py"
      - "validate_csv.py"
      - "build_coordinates.py"
      - "build_change_report.py"
      - "resolve_venue_coordinates.py"
      - "resolve_venue_coordinates_from_osm.py"
      - "send_change_report_email.py"
      - "postcode-overrides.json"
      - "venue-coordinates.json"
      - "requirements.txt"
      - "tests/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-csv-from-pdf
  # A full offline OSM match can take a while. Queue a later refresh rather
  # than cancelling it because someone has changed the site in the meantime.
  cancel-in-progress: false

jobs:
  update-csv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Run browser smoke test
        env:
          RUN_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -p "test_frontend_smoke.py" -v

      - name: Resolve latest PDF source
        id: pdf_source
        shell: bash
        run: |
          shopt -s nullglob
          latest_pdf=""
          echo "GitHub event: ${{ github.event_name }}"
          echo "PDF files currently in repo root:"
          ls -1 *.pdf 2>/dev/null || echo "None"

          if [ "${{ github.event_name }}" = "push" ]; then
            uploaded_pdfs=( )
            for pdf in *.pdf; do
              if [ "$pdf" != "latest-bass-directory.pdf" ]; then
                uploaded_pdfs+=( "$pdf" )
              fi
            done

            echo "Candidate uploaded PDFs:"
            printf '%s\n' "${uploaded_pdfs[@]}"

            if [ "${#uploaded_pdfs[@]}" -gt 0 ]; then
              latest_pdf="${uploaded_pdfs[-1]}"
            fi
          fi

          if [ -n "$latest_pdf" ]; then
            echo "mode=uploaded" >> "$GITHUB_OUTPUT"
            echo "uploaded_pdf=$latest_pdf" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=wordpress" >> "$GITHUB_OUTPUT"

      - name: Download latest PDF from WordPress
        if: steps.pdf_source.outputs.mode == 'wordpress'
        run: python fetch_latest_pdf.py latest-bass-directory.pdf

      - name: Normalise uploaded PDF
        if: steps.pdf_source.outputs.mode == 'uploaded'
        shell: bash
        run: |
          uploaded_pdf="${{ steps.pdf_source.outputs.uploaded_pdf }}"
          if [ "$uploaded_pdf" != "latest-bass-directory.pdf" ]; then
            rm -f latest-bass-directory.pdf
            mv "$uploaded_pdf" latest-bass-directory.pdf
          fi

      - name: Remove older PDF files
        shell: bash
        run: |
          shopt -s nullglob
          for pdf in *.pdf; do
            if [ "$pdf" != "latest-bass-directory.pdf" ]; then
              rm -f "$pdf"
            fi
          done

      - name: Generate candidate CSV
        shell: bash
        run: |
          if [ "${{ steps.pdf_source.outputs.mode }}" = "uploaded" ] && [ -n "${{ steps.pdf_source.outputs.uploaded_pdf }}" ]; then
            python convert_pdf_to_csv.py latest-bass-directory.pdf candidate-pubs.csv --metadata candidate-directory-meta.json --source-name "${{ steps.pdf_source.outputs.uploaded_pdf }}"
          else
            python convert_pdf_to_csv.py latest-bass-directory.pdf candidate-pubs.csv --metadata candidate-directory-meta.json
          fi

      - name: Validate candidate CSV
        id: validate
        continue-on-error: true
        run: python validate_csv.py candidate-pubs.csv --previous pubs.csv --report validation-report.json

      - name: Build candidate coordinates
        if: steps.validate.outcome == 'success'
        run: python build_coordinates.py candidate-pubs.csv candidate-pub-coordinates.json --overrides postcode-overrides.json

      - name: Build auditable change report
        id: changes
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          python build_change_report.py candidate-pubs.csv --previous pubs.csv --output change-report.json
          has_changes=$(python -c "import json; print(str(json.load(open('change-report.json'))['summary']['has_changes']).lower())")
          echo "has_changes=${has_changes}" >> "$GITHUB_OUTPUT"

      - name: Download current Great Britain OpenStreetMap extract
        if: steps.validate.outcome == 'success' && (steps.changes.outputs.has_changes == 'true' || github.event_name != 'push')
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 15 --output great-britain-latest.osm.pbf \
            https://download.geofabrik.de/europe/great-britain-latest.osm.pbf

      - name: Resolve precise coordinates against the offline OSM extract
        if: steps.validate.outcome == 'success' && (steps.changes.outputs.has_changes == 'true' || github.event_name != 'push')
        run: python resolve_venue_coordinates_from_osm.py great-britain-latest.osm.pbf candidate-pubs.csv candidate-venue-coordinates.json --existing venue-coordinates.json

      - name: Show validation report
        if: always()
        shell: bash
        run: |
          if [ -f validation-report.json ]; then
            cat validation-report.json
          else
            echo "validation-report.json was not created."
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-csv-debug
          path: |
            validation-report.json
            candidate-pubs.csv
            candidate-directory-meta.json
            candidate-pub-coordinates.json
            candidate-venue-coordinates.json
            change-report.json
            latest-bass-directory.pdf
          if-no-files-found: warn

      - name: Check email config
        id: email_config
        if: always() && steps.validate.outcome == 'failure'
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          if [ -n "${SMTP_HOST}" ] && [ -n "${SMTP_USERNAME}" ] && [ -n "${SMTP_PASSWORD}" ] && [ -n "${ALERT_TO}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SMTP alert is not configured; GitHub issue fallback will be used."

      - name: Check change-report email config
        id: change_report_email_config
        if: steps.validate.outcome == 'success' && (steps.changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CHANGE_REPORT_TO: ${{ secrets.CHANGE_REPORT_TO }}
        run: |
          if [ -n "${SMTP_HOST}" ] && [ -n "${SMTP_USERNAME}" ] && [ -n "${SMTP_PASSWORD}" ] && [ -n "${CHANGE_REPORT_TO}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Change-report email is not configured; set CHANGE_REPORT_TO and the SMTP secrets."
          fi

      - name: Email validated change report
        if: steps.validate.outcome == 'success' && (steps.changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch') && steps.change_report_email_config.outputs.configured == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CHANGE_REPORT_TO: ${{ secrets.CHANGE_REPORT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python send_change_report_email.py --report change-report.json

      - name: Email validation failure
        if: always() && steps.validate.outcome == 'failure' && steps.email_config.outputs.configured == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python send_alert_email.py --subject "BassBeerMap update rejected" --report validation-report.json

      - name: Create GitHub issue fallback alert
        if: always() && (steps.validate.outcome == 'failure' || failure())
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('validation-report.json')
              ? JSON.parse(fs.readFileSync('validation-report.json', 'utf8'))
              : { errors: ['The workflow failed before validation could produce a report.'] };
            const errors = (report.errors || []).map(error => `- ${error}`).join('\n');
            const title = 'BassBeerMap update rejected';
            const body = [
              'The automated PDF-to-CSV update was rejected.',
              '',
              'Validation errors:',
              errors || '- No validation errors were recorded.',
              '',
              `Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail workflow after rejected validation
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Candidate CSV failed validation. See validation-report.json for details."
          exit 1

      - name: Publish validated CSV
        shell: bash
        run: |
          mv candidate-pubs.csv pubs.csv
          mv candidate-directory-meta.json directory-meta.json
          mv candidate-pub-coordinates.json pub-coordinates.json
          mv candidate-venue-coordinates.json venue-coordinates.json

      - name: Commit refreshed PDF and CSV
        shell: bash
        run: |
          if git diff --quiet -- '*.pdf' pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json; then
            echo "No PDF, CSV, or metadata changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.pdf' pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json
          git commit -m "Refresh latest PDF, CSV, and coordinates"
          git push
