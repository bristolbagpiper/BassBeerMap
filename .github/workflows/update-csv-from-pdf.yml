name: Update CSV From PDF

on:
  push:
    paths:
      - "*.pdf"
      - "convert_pdf_to_csv.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find source PDF
        id: pdf
        shell: bash
        run: |
          shopt -s nullglob
          pdfs=( *.pdf )

          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo "No PDF file found in the repo root."
            exit 1
          fi

          if [ "${#pdfs[@]}" -ne 1 ]; then
            echo "Expected exactly one PDF file in the repo root, found ${#pdfs[@]}."
            printf '%s\n' "${pdfs[@]}"
            exit 1
          fi

          echo "pdf_path=${pdfs[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate pubs.csv
        run: python convert_pdf_to_csv.py "${{ steps.pdf.outputs.pdf_path }}" pubs.csv

      - name: Commit updated CSV
        shell: bash
        run: |
          if git diff --quiet -- pubs.csv; then
            echo "pubs.csv is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubs.csv
          git commit -m "Update pubs.csv from PDF"
          git push
