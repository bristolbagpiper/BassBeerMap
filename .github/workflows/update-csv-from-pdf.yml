name: Update CSV From PDF

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      email_change_report:
        description: Email the listing change report after this manual import
        type: boolean
        default: false
      allow_reindex:
        description: Allow reviewed listing changes from an unchanged PDF
        type: boolean
        default: false
  push:
    branches:
      - main
    paths: ["*.pdf"]

permissions:
  actions: write
  contents: write
  pages: write
  issues: write

concurrency:
  group: directory-data
  queue: max
  # Owner-approved corrections and imports can update the same directory.
  cancel-in-progress: false

jobs:
  update-csv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Queued jobs validate/publish against the latest main data, while
          # the selector extracts uploads from the exact push event commit.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve latest PDF source
        id: pdf_source
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python pdf_source_selector.py

      - name: Download latest PDF from WordPress
        id: wordpress_download
        if: steps.pdf_source.outputs.mode == 'wordpress'
        run: python fetch_latest_pdf.py latest-bass-directory.pdf

      - name: Compare upstream PDF with the published source
        id: source_fingerprint
        if: steps.pdf_source.outputs.mode == 'wordpress' && !inputs.allow_reindex && !inputs.email_change_report
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          previous = subprocess.run(['git', 'show', 'HEAD:latest-bass-directory.pdf'], check=True,
                                    stdout=subprocess.PIPE).stdout
          downloaded = Path('latest-bass-directory.pdf').read_bytes()
          previous_hash = hashlib.sha256(previous).hexdigest()
          downloaded_hash = hashlib.sha256(downloaded).hexdigest()
          unchanged = previous_hash == downloaded_hash
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"unchanged={str(unchanged).lower()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Directory source check\n\n')
              summary.write(f'- Published PDF SHA-256: `{previous_hash}`\n')
              summary.write(f'- Downloaded PDF SHA-256: `{downloaded_hash}`\n')
              summary.write(f'- Source unchanged: `{str(unchanged).lower()}`\n')
              if unchanged:
                  summary.write('- Pipeline, browser and publication checks skipped; current Pages integrity schedule remains independent.\n')
          print(f"Source PDF SHA-256: {downloaded_hash}; unchanged={str(unchanged).lower()}")
          PY

      - name: Install dependencies
        if: steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        run: pip install -r requirements.txt

      - name: Generate candidate CSV
        if: steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        env:
          PDF_SOURCE_PATH: ${{ steps.pdf_source.outputs.source_pdf }}
          PDF_SOURCE_NAME_FILE: ${{ steps.pdf_source.outputs.source_name_file }}
          PDF_SOURCE_MODE: ${{ steps.pdf_source.outputs.mode }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          source = os.environ['PDF_SOURCE_PATH']
          args = [sys.executable, 'convert_pdf_to_csv.py', source, 'candidate-pubs.csv',
                  '--metadata', 'candidate-directory-meta.json']
          name_file = os.environ.get('PDF_SOURCE_NAME_FILE', '')
          if name_file:
              with open(name_file, encoding='utf-8') as handle:
                  args += ['--source-name', json.load(handle)]
          subprocess.run(args, check=True)
          PY

      - name: Reconcile, enrich and validate the complete candidate release
        id: candidate
        if: steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        env:
          PDF_SOURCE_PATH: ${{ steps.pdf_source.outputs.source_pdf }}
        run: python ingest_directory.py candidate-pubs.csv --staging candidate-release --source-pdf "$PDF_SOURCE_PATH"

      - name: Validate candidate files again before publication
        id: candidate_validation
        if: steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        run: python validate_directory_release.py --root candidate-release --previous . --check-pdf

      - name: Guard against unexpected changes from an unchanged PDF
        if: steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        env:
          ALLOW_REINDEX: ${{ inputs.allow_reindex }}
          PDF_SOURCE_PATH: ${{ steps.pdf_source.outputs.source_pdf }}
          PDF_BASELINE_REF: ${{ github.event.before || 'HEAD' }}
        run: |
          args=(--source-pdf "$PDF_SOURCE_PATH" --baseline-ref "$PDF_BASELINE_REF")
          if [ "$ALLOW_REINDEX" = "true" ]; then
            args+=(--allow-reindex)
          fi
          python guard_unchanged_pdf.py "${args[@]}"

      - name: Run browser smoke test against the candidate release
        if: steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        env:
          RUN_BROWSER_TESTS: "1"
          DIRECTORY_TEST_ROOT: candidate-release
        run: python -m unittest discover -s tests -p "test_frontend_smoke.py" -v

      - name: Upload candidate validation and review artifacts
        if: always() && steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: directory-import-review
          path: candidate-release/
          if-no-files-found: warn

      - name: Publish the complete validated release
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.pdf_source.outputs.mode != 'skip' && steps.source_fingerprint.outputs.unchanged != 'true'
        run: |
          python validate_directory_release.py --root candidate-release --previous .
          python -c "from pathlib import Path; from shutil import copyfile; from directory_release import RELEASE_FILES; [copyfile(Path('candidate-release') / name, name) for name in RELEASE_FILES]"
          python validate_directory_release.py
          if git diff --quiet -- latest-bass-directory.pdf pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json; then
            echo "No directory changes detected."
            echo "state=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- latest-bass-directory.pdf pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json
          git commit -m "Publish validated directory release"
          python promote_checked_commit.py
          echo "state=published" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify GitHub Pages release
        id: pages_release
        if: steps.publication.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_PAGES_COMMIT: ${{ steps.publication.outputs.commit }}
        run: python request_pages_release.py

      - name: Report Pages deployment failure
        if: failure() && steps.pages_release.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'BassBeerMap Pages deployment failed';
            const body = [`The validated directory release was committed, but the GitHub Pages deployment/readback did not complete for commit ${{ steps.publication.outputs.commit }}.`, '', `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

      - name: Close recovered Pages deployment failures
        if: steps.pages_release.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap Pages deployment failed')) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
            }

      - name: Email the validated change report when manually requested
        id: change_report_email
        # A mail failure has its own visible outcome and issue below. The data
        # workflow must still trigger post-import validation after publication.
        continue-on-error: true
        if: always() && github.event_name == 'workflow_dispatch' && inputs.email_change_report && steps.candidate_validation.outcome == 'success' && steps.publication.outcome == 'success' && steps.pages_release.outcome != 'failure'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CHANGE_REPORT_TO: ${{ secrets.CHANGE_REPORT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$CHANGE_REPORT_TO" ]; then
            echo "state=not_configured" >> "$GITHUB_OUTPUT"
            echo "Import email: not configured; validated release processing continues without a change-report email." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          has_changes=$(python -c "import json; print(str(bool(json.load(open('candidate-release/change-report.json'))['summary']['has_changes'])).lower())")
          if [ "$has_changes" != "true" ]; then
            echo "state=suppressed_no_changes" >> "$GITHUB_OUTPUT"
            echo "Import email: no listing changes; notification suppressed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "state=attempted" >> "$GITHUB_OUTPUT"
          python send_change_report_email.py --report candidate-release/change-report.json
          echo "state=accepted" >> "$GITHUB_OUTPUT"
          echo "Import email: accepted by the configured SMTP server." >> "$GITHUB_STEP_SUMMARY"

      - name: Close resolved import alerts
        if: always() && steps.candidate_validation.outcome == 'success' && steps.publication.outcome == 'success' && steps.pages_release.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state:'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap update rejected')) {
              await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed', state_reason:'completed'});
            }

      - name: Report rejected import
        if: failure() && steps.source_fingerprint.outputs.unchanged != 'true' && steps.publication.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'candidate-release/validation-report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
            const errors = report.errors?.length ? report.errors : ['The workflow failed; inspect the failed step and candidate artifacts.'];
            const title = 'BassBeerMap update rejected';
            const body = ['The previous published release is retained.', '', ...errors.map(e => `- ${e}`), '', `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

      - name: Report import email delivery failure
        if: always() && steps.change_report_email.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'BassBeerMap import email delivery failed';
            const body = ['The import candidate was validated and the repository publication step completed, but change-report email delivery was not acknowledged by SMTP.', '', 'Check the failed email step and SMTP configuration. This records server acceptance only; it does not prove inbox delivery.', '', `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

      - name: Close recovered import email failures
        if: success() && steps.change_report_email.outputs.state == 'accepted'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open'});
            for (const issue of issues.filter(i => i.title === 'BassBeerMap import email delivery failed')) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
            }

      - name: Summarize import, publication and email states
        if: always()
        env:
          CANDIDATE_INGEST_OUTCOME: ${{ steps.candidate.outcome }}
          CANDIDATE_VALIDATION_OUTCOME: ${{ steps.candidate_validation.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          PUBLICATION_STATE: ${{ steps.publication.outputs.state }}
          PAGES_OUTCOME: ${{ steps.pages_release.outcome }}
          EMAIL_OUTCOME: ${{ steps.change_report_email.outcome }}
          EMAIL_STATE: ${{ steps.change_report_email.outputs.state }}
        run: |
          {
            echo "## Import outcome"
            echo "- Candidate ingestion: ${CANDIDATE_INGEST_OUTCOME:-not reached}"
            echo "- Candidate validation: ${CANDIDATE_VALIDATION_OUTCOME:-not reached}"
            echo "- Repository publication: ${PUBLICATION_STATE:-${PUBLICATION_OUTCOME:-not reached}}"
            echo "- GitHub Pages deployment/readback: ${PAGES_OUTCOME:-not reached}"
            echo "- Change-report email: ${EMAIL_STATE:-${EMAIL_OUTCOME:-not reached}}"
          } >> "$GITHUB_STEP_SUMMARY"

