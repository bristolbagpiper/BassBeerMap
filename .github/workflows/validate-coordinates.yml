name: Validate coordinates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coordinate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python build_coordinate_verification.py
      - run: python validate_directory_release.py --check-pdf
      - run: python validate_coordinate_verification.py
      - run: git diff --exit-code -- coordinate-verification.json
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js tests/*.test.mjs

  record-validation:
    needs: coordinate-audit
    if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      # Rulesets ignore job checks from workflow_dispatch. Record the tested
      # revision using the repository token only after coordinate-audit passes.
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: 'success',
              context: 'validated-directory',
              description: 'Directory, PDF and test suite passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
