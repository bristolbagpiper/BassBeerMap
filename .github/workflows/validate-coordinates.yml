name: Validate coordinates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coordinate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_coordinate_verification.py
      - run: python validate_coordinate_verification.py --require-all-verified --max-evidence-age-days 400
      - run: git diff --exit-code -- coordinate-verification.json
      - run: python -m unittest tests.test_coordinate_audit_regressions tests.test_coordinate_verification
