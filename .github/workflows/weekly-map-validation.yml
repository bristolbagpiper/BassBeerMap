name: Daily map validation

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Update CSV From PDF']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: directory-data
  queue: max
  cancel-in-progress: false

jobs:
  map-health:
    # Imports already check new/unresolved venues against CAMRA. Follow each
    # successful import with both source rotations against the current release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
      - name: Validate all committed map assets
        run: python validate_directory_release.py --allow-expired-evidence
      - name: Check the live map and rotate 45 external venue checks
        id: audit
        run: python audit_map_health.py --limit 45
      - name: Publish confirmed checks and quarantine disputed pins
        # A live deployment failure must not discard safe source checks. Invalid
        # candidate assets are never copied, even when the audit exited nonzero.
        if: always() && steps.audit.outcome != 'skipped'
        run: |
          if ! python -c "from directory_release import read_json; assert read_json('candidate-health/health-report.json', {}).get('valid')"; then exit 0; fi
          python validate_directory_release.py --root candidate-health --previous . --allow-review-downgrades
          python -c "from pathlib import Path; from shutil import copyfile; from directory_release import RELEASE_FILES; [copyfile(Path('candidate-health') / name, name) for name in RELEASE_FILES + ['coordinate-health-state.json']]"
          python validate_directory_release.py
          if git diff --quiet -- pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json coordinate-health-state.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubs.csv directory-meta.json pub-coordinates.json venue-coordinates.json coordinate-verification.json venue-registry.json directory-release.json location-review.json coordinate-health-state.json
          git commit -m 'Refresh coordinate evidence and map health'
          git push
      - name: Persist the latest map health status, including failed audits
        if: always()
        env:
          PIPELINE_STATUS: ${{ job.status }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_RUN_ATTEMPT: ${{ github.run_attempt }}
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -c "import os; from audit_map_health import write_health_status; write_health_status('candidate-health', 'map-health-status.json', os.environ['AUDIT_RUN_ID'], os.environ['AUDIT_RUN_URL'], os.environ['PIPELINE_STATUS'] == 'failure', os.environ['AUDIT_RUN_ATTEMPT'])"
          git add map-health-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record latest map health result' -- map-health-status.json
          git push
      - name: Read configured Google review provider
        id: google_provider
        if: always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        run: |
          provider=$(python -c "import json; from pathlib import Path; p=Path('google-review-provider.json'); c=json.loads(p.read_text()) if p.exists() else {'provider':'places-api'}; v=c.get('provider') if isinstance(c,dict) else None; assert set(c)=={'provider'} and v in ('places-api','hermes-browser','hermes-local'); print(v)")
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Rotate Google Places comparisons
        id: google
        # Run after safe CAMRA results publish, even if that source failed.
        # Google failures cannot prevent those results from being committed.
        # In hermes-browser mode this routes and validates the sanitized local
        # execution receipt; the local run_id is preserved for exact dispatch
        # verification, while this Actions run is recorded separately.
        if: always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.google_provider.outcome == 'success' && steps.google_provider.outputs.provider != 'hermes-local'
        env:
          GOOGLE_PLACES_ENABLED: ${{ vars.GOOGLE_PLACES_ENABLED }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_RUN_ATTEMPT: ${{ github.run_attempt }}
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python audit_google_comparisons.py --root . --state google-places-state.json --status google-places-status.json --limit 45
      - name: Persist Google comparison status and rotation, including partial failures
        if: always() && steps.google_provider.outputs.provider == 'places-api' && steps.google.outcome != 'skipped' && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        run: |
          files=(google-places-status.json)
          if [ -f google-places-state.json ]; then files+=(google-places-state.json); fi
          git add -- "${files[@]}"
          if git diff --cached --quiet -- "${files[@]}"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Google comparison results' -- "${files[@]}"
          git push
      - name: Upload health report and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-health-review
          path: |
            candidate-health/
            map-health-status.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Google comparison artifacts
        if: always() && steps.google.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: google-comparison-review
          path: |
            google-places-state.json
            google-places-status.json
          retention-days: 7
          if-no-files-found: warn
